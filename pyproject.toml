[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "identity-matching"
version = "0.1.0"
description = "Single source of truth for matching person names and ID/passport numbers extracted from identity documents"
requires-python = ">=3.10"
dependencies = [
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/identity_matching"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
